[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avtozyabr"
version = "0.1.0"
description = "Automated wishlist monitor and order assistant for Zolotoe Yabloko"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "asyncpg>=0.29.0",
    "aiogram>=3.10.0",
    "apscheduler>=3.10.4",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "sentry-sdk>=2.6.0",
    "playwright>=1.44.0",
    "browser-cookie3>=0.19.1",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
avtozyabr = "avtozyabr.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avtozyabr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
